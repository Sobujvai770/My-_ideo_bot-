<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Video Mini App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <!-- মূল কন্টেইনার / ভিডিও লিস্ট -->
    <main class="p-4 max-w-md mx-auto space-y-4">

        <!-- ভিডিও কার্ড -->
        <div class="bg-slate-800 rounded-xl shadow-lg border border-slate-700 p-4">

            <!-- থাম্বনেইল ইমেজ (এতে ক্লিক করলে লক বক্স দেখাবে) -->
            <div class="relative cursor-pointer" onclick="toggleLockBox()">
                <img src="https://files.catbox.moe/apifn2.jpeg" alt="Thumbnail" class="w-full h-48 object-cover rounded-lg">
            </div>

            <!-- আপনার ভিডিওর সুন্দর ক্যাপশন -->
            <div class="mt-3">
                <p class="font-semibold text-sm">কি করাটাই না করলো সেই একটা কড়া মাল পুরা ১৫:২৩ সেকেন্ড</p>
            </div>

            <!-- লক / টাইমার বক্স (প্রথমে লুকিয়ে থাকবে, থাম্বনেইলে ক্লিক করলে আসবে) -->
            <div id="lock-box-1" class="mt-4 bg-slate-900/60 p-3 rounded-lg text-center border border-slate-700 hidden">
                <p id="timer-text-1" class="text-sm text-yellow-400 mb-2">🔒 ভিডিওটি লক করা আছে</p>
                <button onclick="startUnlockTimer(1)" id="unlock-btn-1" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-medium py-2 rounded-lg transition">
                    অ্যাড দেখে আনলক করুন 🚀
                </button>
            </div>

            <!-- আসল ভিডিও প্লেয়ার (লক খোলার পর দেখাবে) -->
            <div id="video-box-1" class="hidden mt-4">
                <video controls class="w-full rounded-lg">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    আপনার ব্রাউজার ভিডিও ট্যাগ সমর্থন করে না।
                </video>
                <p class="text-xs text-green-400 mt-2 text-center">✅ সফলভাবে আনলক হয়েছে!</p>
            </div>

        </div>

    </main>

    <!-- জাভাস্ক্রিপ্ট লজিক -->
    <script>
        // টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজেশন
        let tg = window.Telegram.WebApp;
        tg.expand();

        // থাম্বনেইলে ক্লিক করলে লক বক্স দেখানোর ফাংশন
        function toggleLockBox() {
            let lockBox = document.getElementById('lock-box-1');
            if (lockBox.classList.contains('hidden')) {
                lockBox.classList.remove('hidden');
            } else {
                lockBox.classList.add('hidden');
            }
        }

        // অ্যাড দেখে টাইমার শুরু করার এবং অ্যাড খোলার ফাংশন
        function startUnlockTimer(id) {
                      let adsterraUrl = "https://pl31154034.profitablecaterpanetwork.com/82/2a/84/822a8441faf0c6e471f49615a9d36232";
            window.open(adsterraUrl, '_blank');

            let timerText = document.getElementById(`timer-text-${id}`);
            let unlockBtn = document.getElementById(`unlock-btn-${id}`);
            let lockBox = document.getElementById(`lock-box-${id}`);
            let videoBox = document.getElementById(`video-box-${id}`);

            // বাটন ডিজেবল করা
            unlockBtn.disabled = true;
            unlockBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let timeLeft = 10;
            let countdown = setInterval(() => {
                timeLeft--;
                timerText.innerHTML = `⏳ অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    // লক বক্স লুকিয়ে ভিডিও প্লেয়ার দেখানো
                    lockBox.style.display = 'none';
                    videoBox.classList.remove('hidden');
                }
            }, 1000);
        }
    </script>
</body>
</html>
