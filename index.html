<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Bot Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .rainbow-border {
            background: linear-gradient(60deg, #f7931a, #ff007f, #7928ca, #00dfd8);
            padding: 2px;
            border-radius: 1rem;
        }
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans pb-10">

    <!-- স্প্ল্যাশ স্ক্রিন -->
    <div id="splash-screen">
        <img src="https://files.catbox.moe/apifn2.jpeg" class="w-24 h-24 rounded-full object-cover border-2 border-orange-500 shadow-2xl animate-pulse">
        <h2 class="text-orange-500 font-bold text-lg mt-3">My Video Bot</h2>
        <p class="text-xs text-slate-400 mt-1">লোড হচ্ছে, একটু অপেক্ষা করুন...</p>
    </div>

    <!-- টপ হেডার -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#1e293b] border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-orange-500 font-bold text-lg">🔥 My Video Bot Hub</span>
        </div>
    </header>

    <!-- স্ট্যাটাস ও Recent Added -->
    <main class="p-4 max-w-md mx-auto space-y-4">
        <div class="flex items-center justify-between text-yellow-400 font-semibold text-sm">
            <div class="flex items-center space-x-1">
                <span>⚡</span>
                <span>Recent Added</span>
            </div>
        </div>

        <!-- ভিডিও কন্টেইনার -->
        <div id="video-container" class="space-y-4"></div>
    </main>

    <!-- মডাল বা পপআপ (অ্যাড ও ভিডিও আনলক করার জন্য) -->
    <div id="unlock-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-[#1e293b] w-full max-w-sm rounded-2xl p-4 border border-slate-700 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white font-bold">✕</button>
            
            <h3 class="font-bold text-sm text-yellow-400 mb-2">🔒 Select Quality / Part</h3>
            <p class="text-xs text-slate-300 mb-4">1. Select any quality or part below.<br>2. Wait for 10 seconds on the opened link.<br>3. Return to the app to automatically receive the file!</p>
            
            <div id="modal-content">
                <!-- ডায়নামিক বাটন এখানে আসবে -->
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // এখানে আপনার যত খুশি ভিডিও যোগ করতে পারবেন
        const videosData = [
            {
                id: 1,
                parts: "2 Parts",
                thumbnail: "https://files.catbox.moe/apifn2.jpeg",
                caption: "এই মেয়ের একটা নিউ ভাইরাল ভিডিও বাইরে বাই কি জিনিস 💋",
                views: "2.3k",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                adsterraUrl: "https://pl31154034.profitablecaterpanetwork.com/82/2a/84/822a8441faf0c6e471f49615a9d36232"
            },
            {
                id: 2,
                parts: "1 Part",
                thumbnail: "https://files.catbox.moe/apifn2.jpeg",
                caption: "এই মেয়ের একটা ভাইরাল ভিডিও উফফ 💋",
                views: "6.1k",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                adsterraUrl: "https://pl31154034.profitablecaterpanetwork.com/82/2a/84/822a8441faf0c6e471f49615a9d36232"
            }
        ];

        const container = document.getElementById('video-container');

        videosData.forEach(video => {
            const card = document.createElement('div');
            card.className = "rainbow-border shadow-xl";
            card.innerHTML = `
                <div class="bg-[#1e293b] rounded-2xl p-3">
                    <div class="relative cursor-pointer rounded-xl overflow-hidden bg-slate-800" onclick="openModal(${video.id})">
                        <div class="absolute top-2 right-2 bg-black/70 text-yellow-400 px-2 py-0.5 rounded text-[10px] font-bold z-10">
                            ${video.parts}
                        </div>
                        <div class="grid grid-cols-3 gap-1 h-32">
                            <img src="${video.thumbnail}" class="w-full h-full object-cover">
                            <img src="${video.thumbnail}" class="w-full h-full object-cover">
                            <img src="${video.thumbnail}" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-0.5 rounded-md text-[11px] flex items-center space-x-1 text-slate-200">
                            <span>👁️</span>
                            <span>${video.views}</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-3">
                        <div class="flex items-center space-x-2">
                            <div class="w-6 h-6 rounded-full bg-orange-600 flex items-center justify-center font-bold text-[10px]">TB</div>
                            <p class="text-xs font-medium text-slate-200 line-clamp-1">${video.caption}</p>
                        </div>
                        <div class="bg-red-600 p-1.5 rounded-full text-white text-xs">▶</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        function openModal(id) {
            const video = videosData.find(v => v.id === id);
            const modalContent = document.getElementById('modal-content');
            
            modalContent.innerHTML = `
                <button onclick="startUnlock(${video.id}, '${video.adsterraUrl}', '${video.videoUrl}')" id="unlock-btn-${video.id}" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 p-3 rounded-xl flex items-center justify-between text-xs text-white transition">
                    <span class="flex items-center space-x-2">
                        <span>📥</span>
                        <span>Video Part [HD]</span>
                    </span>
                    <span class="bg-emerald-600/30 text-emerald-400 p-1 rounded">🔒</span>
                </button>
            `;
            document.getElementById('unlock-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('unlock-modal').classList.add('hidden');
        }

        function startUnlock(id, adUrl, videoUrl) {
            window.open(adUrl, '_blank');
            const btn = document.getElementById(`unlock-btn-${id}`);
            
            btn.disabled = true;
            let timeLeft = 10;
            
            let countdown = setInterval(() => {
                timeLeft--;
                btn.innerHTML = `<span>⏳ অপেক্ষা করুন: ${timeLeft} সেকেন্ড</span>`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    btn.innerHTML = `<span>✅ আনলক সফল! দেখতে ক্লিক করুন</span>`;
                    btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 p-3 rounded-xl text-center text-xs text-white font-bold transition";
                    btn.onclick = function() {
                        window.location.href = videoUrl; // সরাসরি ভিডিও লিংকে নিয়ে যাবে
                    };
                }
            }, 1000);
        }

        window.addEventListener('load', function() {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 600);
        });
    </script>
</body>
</html>
