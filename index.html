<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAIRAL VIDEO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .rainbow-border {
            background: linear-gradient(60deg, #f7931a, #ff007f, #7928ca, #00dfd8);
            padding: 2px;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans">

    <!-- ওপরের হেডার বার -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#1e293b] border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🔥</span>
            <h1 class="font-bold text-lg text-orange-500">VAIRAL VIDEO</h1>
        </div>
        <button class="text-slate-400 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
    </header>

    <!-- মূল কন্টেইনার (যেখানে ভিডিওগুলো ডায়নামিকভাবে লোড হবে) -->
    <main id="video-container" class="p-4 max-w-md mx-auto space-y-4">
        <div class="flex items-center space-x-1 text-yellow-400 font-semibold text-sm">
            <span>⚡</span>
            <span>Recent Added</span>
        </div>
    </main>

    <!-- জাভাস্ক্রিপ্ট লজিক -->
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 🔥 এখানে আপনি যত খুশি নতুন ভিডিও যোগ করতে পারবেন (কমা দিয়ে দিয়ে নিচে নিচে বাড়াবেন)
        const videosData = [
            {
                id: 1,
                thumbnail: "https://files.catbox.moe/apifn2.jpeg",
                caption: "নিউ ভাইরাল ভিডিও প্রেমিককে সব খুলে দেখাচ্ছে",
                views: "2.3k",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                adsterraUrl: "https://pl31154034.profitablecaterpanetwork.com/82/2a/84/822a8441faf0c6e471f49615a9d36232"
            }
            // আরেকটি ভিডিও যোগ করতে চাইলে ওটার মতো নিচে কমা দিয়ে ব্র্যাকেট দিন:
            /*
            {
                id: 2,
                thumbnail: "ছবির_লিংক",
                caption: "ভিডিওর_ক্যাপশন",
                views: "1.5k",
                videoUrl: "ভিডিওর_লিংক",
                adsterraUrl: "অ্যাডস্টেরা_লিংক"
            }
            */
        ];

        const container = document.getElementById('video-container');

        // ডাটা লুপ চালিয়ে কার্ড তৈরি করা
        videosData.forEach(video => {
            const card = document.createElement('div');
            card.className = "rainbow-border shadow-xl";
            card.innerHTML = `
                <div class="bg-[#1e293b] rounded-2xl p-3">
                    <div class="relative cursor-pointer rounded-xl overflow-hidden bg-slate-800" onclick="toggleLockBox(${video.id})">
                        <div class="grid grid-cols-3 gap-1 h-36">
                            <img src="${video.thumbnail}" class="w-full h-full object-cover">
                            <img src="${video.thumbnail}" class="w-full h-full object-cover">
                            <img src="${video.thumbnail}" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute bottom-2 left-2 bg-black/70 px-2 py-0.5 rounded-md text-[11px] flex items-center space-x-1 text-slate-200">
                            <span>👁️</span>
                            <span>${video.views}</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-3">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-red-600 flex items-center justify-center font-bold text-xs">VV</div>
                            <p class="text-xs font-medium text-slate-200 line-clamp-1">${video.caption}</p>
                        </div>
                        <div class="bg-red-600/80 p-1.5 rounded-full text-white">▶</div>
                    </div>

                    <div id="lock-box-${video.id}" class="mt-3 bg-slate-900/90 p-3 rounded-xl text-center border border-slate-700 hidden">
                        <p id="timer-text-${video.id}" class="text-xs text-yellow-400 mb-2">🔒 ভিডিওটি লক করা আছে</p>
                        <button onclick="startUnlockTimer(${video.id}, '${video.adsterraUrl}')" id="unlock-btn-${video.id}" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-medium py-2 rounded-lg text-xs transition shadow-md">
                            অ্যাড দেখে আনলক করুন 🚀
                        </button>
                    </div>

                    <div id="video-box-${video.id}" class="hidden mt-3">
                        <video controls class="w-full rounded-xl">
                            <source src="${video.videoUrl}" type="video/mp4">
                            আপনার ব্রাউজার ভিডিও ট্যাগ সমর্থন করে না।
                        </video>
                        <p class="text-[11px] text-emerald-400 mt-2 text-center">✅ সফলভাবে আনলক হয়েছে!</p>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        function toggleLockBox(id) {
            let lockBox = document.getElementById(`lock-box-${id}`);
            if (lockBox.classList.contains('hidden')) {
                lockBox.classList.remove('hidden');
            } else {
                lockBox.classList.add('hidden');
            }
        }

        function startUnlockTimer(id, adUrl) {
            window.open(adUrl, '_blank');

            let timerText = document.getElementById(`timer-text-${id}`);
            let unlockBtn = document.getElementById(`unlock-btn-${id}`);
            let lockBox = document.getElementById(`lock-box-${id}`);
            let videoBox = document.getElementById(`video-box-${id}`);

            unlockBtn.disabled = true;
            unlockBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let timeLeft = 10;
            let countdown = setInterval(() => {
                timeLeft--;
                timerText.innerHTML = `⏳ অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    lockBox.style.display = 'none';
                    videoBox.classList.remove('hidden');
                }
            }, 1000);
        }
    </script>
</body>
</html>
